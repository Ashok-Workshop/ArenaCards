name: Android CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "rebuild/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create temporary Firebase config for compile-time plugin
        shell: bash
        run: |
          if [ ! -f app/google-services.json ]; then
            mkdir -p app
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "arenacards-ci-placeholder",
              "storage_bucket": "arenacards-ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "com.arenacards.game"
                  }
                },
                "api_key": [
                  {
                    "current_key": "ci-placeholder-not-a-real-api-key"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Run unit tests and assemble debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: arenacards-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
